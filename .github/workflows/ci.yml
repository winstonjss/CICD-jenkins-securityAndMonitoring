name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4. Análisis estático local con ESLint
      - name: Run ESLint
        run: npm run lint || echo "ESLint found some warnings"

      # 5. Ejecutar Pruebas con Jest e informes de cobertura
      - name: Run tests
        run: npm test -- --coverage

      # 6. Escaneo de vulnerabilidades en Dependencias con Snyk
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high # Detiene el pipeline si hay fallos altos o críticos

      # 7. Análisis de calidad de código con SonarQube
      - name: SonarQube Quality Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 8. Validar construcción de la imagen Docker
      - name: Build Docker image validation
        run: docker build -t cicd-lab-webapp:test .