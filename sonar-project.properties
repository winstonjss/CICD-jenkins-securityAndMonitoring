# Identificadores del Proyecto
sonar.projectKey=cicd-jenkins-securityAndMonitoring
sonar.projectName=CICD-jenkins-securityAndMonitoring
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=test

# Configuración de lenguaje y codificación
sonar.language=js
sonar.sourceEncoding=UTF-8

# Exclusiones (para evitar analizar librerías de dependencias)
sonar.exclusions=node_modules/**, dist/**, coverage/**, test/**

# Integración con reportes de cobertura (si se genera con Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info